name: Signed source distribution

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag SemVer existente cujo arquivo-fonte será assinado
        required: true
        default: v0.1.1
        type: string

permissions:
  contents: read

concurrency:
  group: signed-source-${{ github.repository }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  signed-source:
    name: Package and sign source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout da configuração confiável do workflow
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validar tag e release existentes e preservar configuração
        id: target
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          tag = os.environ.get("REQUESTED_TAG", "")
          if not re.fullmatch(r"v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)", tag):
              raise SystemExit("Erro: tag inválida — Solução: informe vMAJOR.MINOR.PATCH existente.")
          repository = os.environ["GITHUB_REPOSITORY"]
          prefix = f"repos/{repository}"
          def api(path):
              # Argumentos separados; nenhum input é interpolado em shell.
              return json.loads(subprocess.check_output(["gh", "api", path], text=True))
          ref = api(f"{prefix}/git/ref/tags/{tag}")["object"]
          for _ in range(8):
              if ref["type"] == "commit":
                  break
              if ref["type"] != "tag":
                  raise SystemExit("Erro: tag não referencia commit — Solução: use uma tag Git válida.")
              ref = api(f"{prefix}/git/tags/{ref['sha']}")["object"]
          else:
              raise SystemExit("Erro: cadeia de tags inválida — Solução: revise a tag existente.")
          commit = ref["sha"]
          if not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit("Erro: commit da tag inválido — Solução: revise a tag existente.")
          release = api(f"{prefix}/releases/tags/{tag}")
          if release["tag_name"] != tag or release["draft"]:
              raise SystemExit("Erro: release não está publicada — Solução: escolha uma release existente publicada.")
          version = tag[1:]
          stem = f"web-search-openrouter-agent-skill_{version}_source.zip"
          checksums = f"web-search-openrouter-agent-skill_{version}_checksums.txt"
          owned = {stem, checksums, stem + ".sig", stem + ".pem", stem + ".sigstore.json"}
          existing = {asset["name"] for asset in release["assets"]}
          if owned & existing:
              raise SystemExit("Erro: artefatos de distribuição já existem — Solução: verifique os assets existentes; nada será sobrescrito.")
          config = Path(".goreleaser.yaml")
          saved = Path(os.environ["RUNNER_TEMP"]) / "signed-source.goreleaser.yaml"
          saved.write_bytes(config.read_bytes())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={tag}\ncommit={commit}\nversion={version}\narchive={stem}\nchecksums={checksums}\n")
          print(f"Release existente validada: {tag}; commit={commit}")
          PY

      - name: Checkout da tag exata para arquivos e código
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.target.outputs.tag }}
          persist-credentials: false
          fetch-depth: 0

      - name: Confirmar commit exato da tag
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ steps.target.outputs.commit }}
          TARGET_TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse "refs/tags/${TARGET_TAG}^{commit}")" = "$EXPECTED_COMMIT"

      - name: Gerar arquivo-fonte e checksums sem modificar a release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --clean --skip=publish --config ${{ runner.temp }}/signed-source.goreleaser.yaml
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.target.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validar fonte pública e checksum do ZIP da tag
        shell: bash
        env:
          ARCHIVE_NAME: ${{ steps.target.outputs.archive }}
          CHECKSUM_NAME: ${{ steps.target.outputs.checksums }}
          SOURCE_VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path, PurePosixPath
          import zipfile

          archive = Path("dist") / os.environ["ARCHIVE_NAME"]
          checksum = Path("dist") / os.environ["CHECKSUM_NAME"]
          prefix = "web-search-openrouter-agent-skill-" + os.environ["SOURCE_VERSION"] + "/"
          with zipfile.ZipFile(archive) as source:
              names = source.namelist()
              if not names or any(not name.startswith(prefix) for name in names):
                  raise SystemExit("Erro: arquivo-fonte com prefixo inesperado — Solução: confira a configuração de source archive.")
              for name in names:
                  parts = PurePosixPath(name).parts
                  if any(p in (".git", "__pycache__", "research-output", "pesquisas") or p.startswith(".env") or p.endswith(".pyc") for p in parts):
                      raise SystemExit("Erro: arquivo privado/gerado no ZIP — Solução: corrija o conteúdo versionado antes de distribuir.")
              required = prefix + "skills/web-search-openrouter-agent-skill/SKILL.md"
              if required not in names:
                  raise SystemExit("Erro: skill ausente no ZIP — Solução: confira a tag escolhida.")
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          rows = [line.split() for line in checksum.read_text(encoding="utf-8").splitlines()]
          if not any(row == [digest, archive.name] for row in rows):
              raise SystemExit("Erro: checksum não corresponde ao ZIP — Solução: investigue a geração do arquivo.")
          print(f"Arquivo-fonte da tag: {archive.name}; SHA256={digest}")
          PY

      - name: Instalar Cosign com verificação de bootstrap
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.5

      - name: Assinar ZIP real usando somente OIDC do GitHub
        shell: bash
        env:
          ARCHIVE_NAME: ${{ steps.target.outputs.archive }}
        run: |
          set -euo pipefail
          archive="dist/$ARCHIVE_NAME"
          # Cosign 2.6.5 exporta bundle moderno + assinatura/certificado reais.
          # Nenhuma chave persistente, token do usuário ou opção insecure é utilizada.
          cosign sign-blob --yes --new-bundle-format \
            --bundle "$archive.sigstore.json" \
            --output-signature "$archive.sig" \
            --output-certificate "$archive.pem" \
            "$archive"
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import ssl

          archive = Path("dist") / os.environ["ARCHIVE_NAME"]
          certificate = Path(str(archive) + ".pem")
          content = certificate.read_bytes()
          # --b64 padrão também codifica o certificado: exportar PEM genuíno.
          if not content.startswith(b"-----BEGIN CERTIFICATE-----"):
              content = base64.b64decode(content, validate=True)
              if not content.startswith(b"-----BEGIN CERTIFICATE-----"):
                  content = ssl.DER_cert_to_PEM_cert(content).encode("ascii")
              certificate.write_bytes(content)
          bundle = json.loads(Path(str(archive) + ".sigstore.json").read_text(encoding="utf-8"))
          signature = base64.b64decode(Path(str(archive) + ".sig").read_bytes(), validate=True)
          message = bundle["messageSignature"]
          if signature != base64.b64decode(message["signature"], validate=True):
              raise SystemExit("Erro: assinatura destacada diverge do bundle — Solução: interrompa a publicação.")
          if hashlib.sha256(archive.read_bytes()).digest() != base64.b64decode(message["messageDigest"]["digest"], validate=True):
              raise SystemExit("Erro: bundle não assina o ZIP real — Solução: interrompa a publicação.")
          material = bundle["verificationMaterial"]
          cert = material.get("certificate")
          if cert is None:
              cert = material["x509CertificateChain"]["certificates"][0]
          exported = ssl.PEM_cert_to_DER_cert(certificate.read_text(encoding="ascii"))
          if exported != base64.b64decode(cert["rawBytes"], validate=True):
              raise SystemExit("Erro: certificado exportado diverge do bundle — Solução: interrompa a publicação.")
          print("Assinatura, certificado PEM e bundle correspondem ao ZIP real.")
          PY
          cosign verify-blob --new-bundle-format \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$archive"

      - name: Adicionar somente os cinco artefatos próprios à release existente
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ steps.target.outputs.tag }}
          ARCHIVE_NAME: ${{ steps.target.outputs.archive }}
          CHECKSUM_NAME: ${{ steps.target.outputs.checksums }}
        run: |
          set -euo pipefail
          archive="dist/$ARCHIVE_NAME"
          test -s "$archive"
          test -s "dist/$CHECKSUM_NAME"
          test -s "$archive.sig"
          test -s "$archive.pem"
          test -s "$archive.sigstore.json"
          # Sem --clobber, sem alterar título/corpo/latest nem outros assets.
          gh release upload "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" \
            "$archive" "dist/$CHECKSUM_NAME" \
            "$archive.sig" "$archive.pem" "$archive.sigstore.json"
          gh release view "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" \
            --json url,tagName,assets
