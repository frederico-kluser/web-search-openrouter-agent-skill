name: CI
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'ci/**', 'docs/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Testes offline
        run: python -m unittest discover -s tests -v
      - name: Sintaxe, formato e documentação
        run: python scripts/check.py
      - name: Instalação global simulada
        run: python scripts/install.py --dry-run --all --json
  build:
    name: build
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir matrix
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Commits convencionais
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          subjects = subprocess.check_output(['git', 'log', '-25', '--pretty=%s'], text=True).splitlines()
          pattern = re.compile(r'^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?!?: .+')
          bad = []
          for subject in subjects:
              if subject.startswith('Merge ') or subject == 'Initial commit':
                  continue
              header = re.sub(r'\s+\(#\d+\)$', '', subject)
              if not pattern.fullmatch(header) or len(header) > 72:
                  bad.append(subject)
          for subject in bad:
              print('Mensagem não convencional:', subject)
          sys.exit(bool(bad))
          PY
